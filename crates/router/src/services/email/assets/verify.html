<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Verify your email</title>
  </head>
  <body style="margin:0;padding:0;background:{background_color};color:{foreground_color};font-family:Arial,Helvetica,sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:{background_color};">
      <tr><td align="center" style="padding:24px 16px;">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:600px;text-align:left;">
          <tr><td style="padding:16px 0 28px;border-bottom:1px solid #cbd4c7;">
            {entity_logo_html}
            <span style="color:{foreground_color};font-size:30px;font-weight:700;line-height:36px;letter-spacing:-0.6px;overflow-wrap:anywhere;">{entity_name}</span>
          </td></tr>
          <tr><td style="padding:32px 0 16px;">
            <h1 style="margin:0;color:{foreground_color};font-size:28px;line-height:36px;font-weight:600;">Your account starts here.</h1>
          </td></tr>
          <tr><td style="color:{foreground_color};font-size:16px;line-height:26px;overflow-wrap:anywhere;">
            <p style="margin:0 0 20px;">Thanks for joining {entity_name}. Confirm your email address to finish setting up your account.</p><p style="margin:0 0 20px;">If you did not create this account, you can ignore this email.</p>
          </td></tr>
          <tr><td style="padding:12px 0 28px;">
                  <a href="{link}" style="display:inline-block;background:{primary_color};color:#ffffff;font-size:16px;font-weight:600;line-height:24px;text-decoration:none;border-radius:8px;padding:14px 24px;">Confirm email address</a>
                </td></tr>
          <tr><td style="padding:24px 0;border-top:1px solid #cbd4c7;color:{foreground_color};font-size:14px;line-height:22px;">
            The {entity_name} team
          </td></tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>
